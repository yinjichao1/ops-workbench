<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="2026年国家电网各批次录用数据查询：输入学校名称，查看它在27家省公司及直属单位的第一批、第二批、第三批录用人数。数据整理自国网拟录用公示。">
<title>2026国家电网录用查询 · 按学校查各省各批次录用人数 - 思格教育</title>
<style>
:root{
  --blue:#0a69cd; --blue-dark:#0C447C; --navy:#1D3557;
  --red:#E63946; --orange:#F77F00; --gold:#FCBF49;
  --bg:#f4f7fb; --card:#ffffff; --line:#e3eaf3;
  --tx:#1c2b3a; --tx2:#5c6b7c; --tx3:#8b98a8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6}
button{font-family:inherit;border:none;background:none;cursor:pointer}
input{font-family:inherit;font-size:15px;outline:none;border:none;background:none}
a{color:var(--blue);text-decoration:none}

.hd{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.hd-in{max-width:680px;margin:0 auto;padding:0 16px;height:50px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--navy)}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--blue);display:inline-block}
.hd-btn{font-size:12px;color:#fff;background:var(--blue);border-radius:99px;padding:6px 14px;font-weight:500}

.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}

/* 首页 hero */
.hero{margin-top:16px;padding:20px 16px 18px;background:#eef4fc;border-radius:16px}
.hero h1{font-size:21px;font-weight:500;color:var(--navy);line-height:1.4}
.hero h1 b{color:var(--blue)}
.hero p{font-size:13px;color:var(--tx2);margin-top:4px}
.search{position:relative;margin-top:14px}
.search-box{display:flex;align-items:center;background:#fff;border:1.5px solid var(--blue);border-radius:12px;padding:4px 4px 4px 14px}
.search-box input{flex:1;height:38px;color:var(--tx)}
.search-box input::placeholder{color:var(--tx3)}
.search-box .go{background:var(--blue);color:#fff;font-size:14px;font-weight:500;border-radius:9px;padding:9px 20px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(13,43,84,.10);overflow:hidden;display:none;z-index:40}
.sug.on{display:block}
.sug-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #f0f4f9;cursor:pointer}
.sug-item:last-child{border-bottom:none}
.sug-item:active{background:#f2f7fd}
.sug-item .n{font-size:14px;color:var(--tx)}
.sug-item .n em{font-style:normal;color:var(--blue);font-weight:500}
.sug-item .v{font-size:12px;color:var(--tx3);flex-shrink:0;margin-left:10px}
.sug-item.pv .n{color:var(--blue);font-weight:500}
.sug-empty{padding:14px;font-size:13px;color:var(--tx3);text-align:center}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:17px;font-weight:500;color:var(--blue)}
.stat span{font-size:11px;color:var(--tx3)}
@media (max-width:420px){.stat b{font-size:15px}}

.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec-t h2{font-size:16px;font-weight:500;color:var(--navy)}
.sec-t span{font-size:12px;color:var(--tx3)}

/* 榜单行 */
.rank-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #f0f4f9;cursor:pointer}
.rank-row:last-child{border-bottom:none}
.rank-row:active{background:#f7fafd}
.rk{width:26px;height:26px;border-radius:8px;background:#eef2f8;color:var(--tx2);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rk.g1{background:var(--gold);color:#6b4a00}
.rk.g2{background:#d8dde4;color:#3d4753}
.rk.g3{background:#f0b28c;color:#7a3c12}
.rank-row .nm{flex:1;font-size:14px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .ct{font-size:13px;color:var(--tx2);flex-shrink:0}
.rank-row .ct b{color:var(--blue);font-weight:500}
.more-btn{display:block;width:100%;text-align:center;padding:10px;font-size:13px;color:var(--blue)}

/* 学校详情 */
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--tx2);margin:14px 0 4px}
.sch-head{margin-top:8px}
.sch-head h1{font-size:20px;font-weight:500;color:var(--navy);line-height:1.4}
.sch-badge{display:inline-block;margin-top:6px;font-size:12px;color:var(--blue);background:#e6f1fb;border-radius:99px;padding:3px 10px}
.sch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tabs{display:flex;background:#e9eff7;border-radius:10px;padding:3px;margin-top:14px}
.tabs button{flex:1;font-size:13px;color:var(--tx2);padding:7px 0;border-radius:8px;font-weight:500}
.tabs button.on{background:#fff;color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--tx2);background:#fff}
.chip.on{border-color:var(--blue);color:var(--blue);background:#e6f1fb;font-weight:500}
.cat-sum{margin-top:12px;font-size:12px;color:var(--tx3)}
.cat-sum b{color:var(--tx2);font-weight:500}

/* 条形图 */
.bars{margin-top:6px}
.bar-row{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.bar-row:active{opacity:.75}
.bar-row .bl{width:76px;font-size:12px;color:var(--tx2);text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .btrack{flex:1;height:16px;background:#eef2f8;border-radius:4px;overflow:hidden}
.bar-row .bfill{height:100%;background:var(--blue);border-radius:4px;min-width:2px}
.bar-row.hot .bfill{background:var(--orange)}
.bar-row .bv{width:44px;font-size:12px;color:var(--tx);font-weight:500;flex-shrink:0;text-align:left}

/* 矩阵表 */
.tbl-wrap{overflow-x:auto;margin-top:6px;-webkit-overflow-scrolling:touch}
table.mx{width:100%;border-collapse:collapse;font-size:13px}
.mx th{font-size:12px;font-weight:500;color:var(--tx3);padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.mx td{padding:0 4px;text-align:center;height:38px;min-width:52px}
.mx td.pv,.mx th.pv{text-align:left;padding-left:2px;position:sticky;left:0;background:#fff;font-weight:500;min-width:86px;white-space:nowrap;font-size:13px;color:var(--tx)}
.mx td.pv span{cursor:pointer;display:block}
.mx td.num{border-radius:6px}
.mx tr td{border-bottom:1px solid #f2f5f9}
.mx td.tot{font-weight:500;color:var(--navy)}

/* 省份反查列表 */
.pv-total{font-size:13px;color:var(--tx2);margin-top:6px}
.pv-total b{color:var(--blue);font-weight:500;font-size:16px}

/* 表单 */
.cta{margin:22px 0 8px;background:var(--navy);border-radius:16px;padding:18px 16px;color:#fff}
.cta h3{font-size:16px;font-weight:500}
.cta p{font-size:12px;color:#c8d4e4;margin-top:3px}
.lead-form{margin-top:12px;display:grid;gap:8px}
.lead-form input{width:100%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:10px;height:42px;padding:0 12px;color:#fff;font-size:14px}
.lead-form input::placeholder{color:#93a4bc}
.lead-form input:focus{border-color:var(--gold)}
.lead-form .f2{display:grid;grid-template-columns:1fr 1.2fr;gap:8px}
.lead-form button{height:44px;border-radius:10px;background:var(--orange);color:#fff;font-size:15px;font-weight:500}
.lead-form button:disabled{opacity:.6}
.f-note{font-size:11px;color:#8fa2bd;text-align:center}
.f-msg{font-size:12px;text-align:center;min-height:16px;color:var(--gold)}
.f-msg.err{color:#ffb3b3}
.f-ok{text-align:center;padding:14px 0 6px}
.f-ok b{display:block;font-size:16px;color:var(--gold);font-weight:500}
.f-ok span{font-size:12px;color:#c8d4e4}

/* 说明 */
.note{font-size:12px;color:var(--tx2)}
.note li{margin:6px 0 0 16px}
.note b{color:var(--tx);font-weight:500}
details summary{cursor:pointer;font-size:13px;color:var(--blue);font-weight:500}

.empty-tip{padding:24px 0;text-align:center;font-size:13px;color:var(--tx3)}

/* 门控：打码与解锁 */
.lockwrap{position:relative;border-radius:12px;overflow:hidden;margin-top:6px}
.lockwrap .blur{filter:blur(7px);opacity:.55;pointer-events:none;user-select:none}
.lockcover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lockbtn{background:#fff;border:1.5px solid var(--blue);color:var(--blue);font-size:13px;font-weight:500;border-radius:99px;padding:10px 18px;box-shadow:0 4px 14px rgba(13,43,84,.14)}
.unlock-card{margin:16px 0 8px;background:var(--navy);border-radius:14px;padding:16px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
.unlock-card .t{font-size:14px;font-weight:500}
.unlock-card .d{font-size:12px;color:#c8d4e4;margin-top:2px}
.unlock-card button{flex-shrink:0;background:var(--orange);color:#fff;font-size:13px;font-weight:500;border-radius:10px;padding:11px 16px}
.mask{position:fixed;inset:0;background:rgba(16,32,54,.52);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:380px;padding:20px;max-height:88vh;overflow:auto;position:relative}
.modal h3{font-size:16px;font-weight:500;color:var(--navy)}
.modal .sub{font-size:12px;color:var(--tx2);margin:2px 0 12px}
.modal .x{position:absolute;top:8px;right:10px;font-size:16px;color:var(--tx3);padding:6px}
.modal .lead-form input{background:#f2f6fb;border:1px solid var(--line);color:var(--tx)}
.modal .lead-form input::placeholder{color:var(--tx3)}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(16,32,54,.92);color:#fff;font-size:13px;border-radius:99px;padding:9px 18px;z-index:200;display:none}
.toast.on{display:block}

footer{margin-top:28px;border-top:1px solid var(--line);padding:16px 0 34px;text-align:center;font-size:11px;color:var(--tx3);line-height:1.8}
</style>
</head>

function aggFor(combos, cats, bt){
  var rows = {}, colT = [0,0,0], catT = [0,0,0,0], grand = 0, i, cb;

    '<div class="stat"><b>3批·7类</b><span>批次口径</span></div>' +
  '</div>' +
  '<div class="sec-t"><h2>全国高校录用 TOP 100</h2><span>点击学校查看分省明细</span></div>' +
  '<div class="card" id="topBox" style="padding:4px 14px">' + topRows(20) + '</div>' +
  '<button class="more-btn" id="exp100">展开全部 TOP 100 ▾</button>' +
  '<div class="sec-t"><h2>数据口径说明</h2></div>' +
  '<div class="card note">' +
    '<ul>' +
      '<li><b>一批 / 二批 · 省市单位：</b>各省市电力公司（含冀北、蒙东）当批次拟录用人数</li>' +
      '<li><b>直属·总分部：</b>国网总部、六个分部及南瑞集团、新源集团、信通产业集团等直属单位，不挂靠省份，单列统计</li>' +
      '<li><b>供服公司：</b>供电服务公司（二批供服为省市公司下属供服公司，三批供服含农电供服）</li>' +
      '<li><b>产业单位：</b>第三批产业单位录用人数</li>' +
      '<li>人数为拟录用公示口径，公示后可能有极少数递补调整，以国网官方公示为准</li>' +
    '</ul>' +
  '</div>' +
  (isUnlocked() ? formHTML("") : unlockCardHTML("解锁全部省份×批次查询")) ;
  app.innerHTML = html;
}

function topRows(n){
  var out = "", i, s;
  for(i = 0; i < Math.min(n, byTotal.length); i++){
    s = byTotal[i];
    out += '<div class="rank-row" data-nav="#/s/' + uenc(s.name) + '">' +
      '<span class="rk ' + (i === 0 ? "g1" : i === 1 ? "g2" : i === 2 ? "g3" : "") + '">' + (i + 1) + '</span>' +
      '<span class="nm">' + esc(s.name) + '</span>' +
      '<span class="ct"><b>' + fmt(s.total) + '</b> 人</span></div>';
  }
  return out;
}

function renderSchool(s){
  if(!s){ renderHome(); return; }
  var locked = !isUnlocked();   /* 0次免费：所有学校/省份均需留资解锁 */
  var bt = STATE.batch, cats = STATE.cats;
  var agg = aggFor(s.combos, cats, bt);
  var frk = filteredRank(s);
  var cols = bt >= 0 ? [bt] : [0, 1, 2];
  var rowsArr = [], p;
  for(p = 0; p < NP; p++){
    if(agg.rows[p]){
      var rt = 0, j;
      for(j = 0; j < cols.length; j++) rt += agg.rows[p][cols[j]];
      if(rt > 0) rowsArr.push([p, rt]);
    }
  }
  rowsArr.sort(function(a,b){ return b[1] - a[1]; });
  var maxCell = 0, maxRow = 0, i;
  cols.forEach(function(b){
    rowsArr.forEach(function(r){
      var v = agg.rows[r[0]][b];
      if(v > maxCell) maxCell = v;
    });
  });
  rowsArr.forEach(function(r){ if(r[1] > maxRow) maxRow = r[1]; });

  /* TOP 省份条形图（含直属单列） */
  var bars = "", showN = Math.min(locked ? 3 : 8, rowsArr.length);
  for(i = 0; i < showN; i++){
    var pr = rowsArr[i], w = Math.max(3, Math.round(pr[1] / maxRow * 100));
    bars += '<div class="bar-row' + (i === 0 ? " hot" : "") + '" data-nav="#/p/' + uenc(PROVS[pr[0]]) + '">' +
      '<span class="bl">' + esc(PROVS[pr[0]]) + '</span>' +
      '<span class="btrack"><span class="bfill" style="width:' + w + '%;display:block"></span></span>' +
      '<span class="bv">' + fmt(pr[1]) + '</span></div>';
  }

  /* 矩阵表 */
  var thead = '<tr><th class="pv">单位</th>';
  cols.forEach(function(b){ thead += "<th>" + BATCHES[b] + "</th>"; });
  if(bt < 0) thead += "<th>合计</th>";
  thead += "</tr>";
  var tbody = "";
  rowsArr.forEach(function(r){
    var tr = '<tr><td class="pv"><span data-nav="#/p/' + uenc(PROVS[r[0]]) + '">' + esc(PROVS[r[0]]) + "</span></td>";
    var rt = 0;
    cols.forEach(function(b){
      var v = agg.rows[r[0]][b];
      rt += v;
      tr += '<td class="num"' + heat(v, maxCell) + ">" + (v ? fmt(v) : "—") + "</td>";
    });
    if(bt < 0) tr += '<td class="tot">' + fmt(rt) + "</td>";
    tr += "</tr>";
    tbody += tr;
  });

  var catSum = "当前口径：", ci;
  for(ci = 0; ci < 4; ci++){
    catSum += (ci ? " · " : "") + "<b>" + CATS[ci] + " " + fmt(agg.catT[ci]) + "</b>";
  }

  var covered = 0;
  rowsArr.forEach(function(r){ if(r[0] < ZPIDX) covered++; });

  var tblCard = '<div class="card tbl-wrap" style="padding:6px 8px"><table class="mx">' + thead + tbody + "</table></div>";
  var barsHint = (locked && rowsArr.length > 3) ? '<p class="cat-sum" style="margin-top:6px">还有 ' + (rowsArr.length - 3) + " 个单位，解锁后查看</p>" : "";

  app.innerHTML = '' +
  '<a class="back" data-nav="#/">‹ 返回首页</a>' +
  '<div class="sch-head">' +
    '<h1>' + esc(s.name) + '</h1>' +
    '<span class="sch-badge">全年口径 ' + fmt(s.total) + ' 人 · 全国第 ' + s.rank + ' 名</span>' +
  '</div>' +
  '<div class="tabs" id="batchTabs">' +
    '<button data-b="-1" class="' + (bt < 0 ? "on" : "") + '">全部</button>' +
    '<button data-b="0" class="' + (bt === 0 ? "on" : "") + '">一批</button>' +
    '<button data-b="1" class="' + (bt === 1 ? "on" : "") + '">二批</button>' +
    '<button data-b="2" class="' + (bt === 2 ? "on" : "") + '">三批</button>' +
  '</div>' +
  '<div class="chips" id="catChips">' + CATS.map(function(c, i){
    return '<button class="chip ' + (STATE.cats[i] ? "on" : "") + '" data-c="' + i + '">' + c + "</button>";
  }).join("") + "</div>" +
  '<div class="sch-stats">' +
    '<div class="stat"><b>' + fmt(agg.grand) + '</b><span>当前口径录用</span></div>' +
    '<div class="stat"><b>' + (frk ? "第" + frk + "名" : "—") + '</b><span>当前口径全国排名</span></div>' +
    '<div class="stat"><b>' + covered + '</b><span>覆盖省公司</span></div>' +
  '</div>' +
  (locked ? "" : '<p class="cat-sum">' + catSum + "</p>") +
  (rowsArr.length ?
    '<div class="sec-t"><h2>录用人数 TOP 单位</h2><span>点击查看该单位高校排行</span></div>' +
    '<div class="card bars">' + bars + "</div>" + barsHint +
    '<div class="sec-t"><h2>各省 · 各批次明细</h2><span>' + (bt < 0 ? "合计口径" : BATCHES[bt] + "口径") + "</span></div>" +
    (locked ?
      '<div class="lockwrap">' + tblCard.replace('<div class="card tbl-wrap"', '<div class="card tbl-wrap blur"') +
      '<div class="lockcover"><button class="lockbtn" data-unlock>留资解锁 · 全部省份×批次明细</button></div></div>'
      : tblCard)
    : '<div class="card empty-tip" style="margin-top:12px">当前批次/类别口径下暂无录用记录，试试切换批次或类别</div>') +
  (locked ? unlockCardHTML("解锁「" + esc(s.name) + "」全部省份明细") : formHTML(s.name));
}

function renderProv(pname){
  var pid = PROVS.indexOf(pname);
  if(pid < 0){ renderHome(); return; }
  var locked = !isUnlocked();
  var cats = STATE.cats, bt = STATE.batch;
  var list = [], i, j;
  for(i = 0; i < SCHOOLS.length; i++){
    var g = 0, cs = SCHOOLS[i].combos;
    for(j = 0; j < cs.length; j++){
      var cb = cs[j];
      if(cb[0] === pid && cats[cb[2]] && (bt < 0 || cb[1] === bt)) g += cb[3];
    }
    if(g > 0) list.push([g, SCHOOLS[i].name, SCHOOLS[i]]);
  }
  list.sort(function(a,b){ return b[0] - a[0]; });
  var grand = 0; list.forEach(function(x){ grand += x[0]; });
  var rows = "", rest = "", n = Math.min(60, list.length);
  for(i = 0; i < n; i++){
    var rowHtml = '<div class="rank-row" data-nav="#/s/' + uenc(list[i][1]) + '">' +
      '<span class="rk ' + (i === 0 ? "g1" : i === 1 ? "g2" : i === 2 ? "g3" : "") + '">' + (i + 1) + "</span>" +
      '<span class="nm">' + esc(list[i][1]) + "</span>" +
      '<span class="ct"><b>' + fmt(list[i][0]) + "</b> 人</span></div>";
    if(locked && i >= 3) rest += rowHtml; else rows += rowHtml;
  }
  var catsOn = [];
  for(i = 0; i < 4; i++) if(cats[i]) catsOn.push(CATS[i]);
  app.innerHTML = '' +
  '<a class="back" data-nav="#/">‹ 返回首页</a>' +
  '<div class="sch-head"><h1>' + esc(pname) + " · 高校录用排行</h1>" +
    '<p class="pv-total">当前口径（' + esc(catsOn.join(" + ") || "未选类别") + (bt >= 0 ? " · " + BATCHES[bt] : " · 全部批次") + '）共 <b>' + fmt(grand) + "</b> 人</p></div>" +
  '<div class="sec-t"><h2>高校排行</h2><span>' + (list.length > 60 ? "显示前 60 所" : "共 " + list.length + " 所") + ' · 点击看分省明细</span></div>' +
  (list.length ?
    '<div class="card" style="padding:4px 14px">' + rows + "</div>" +
    (rest ? '<div class="lockwrap" style="margin-top:10px"><div class="card blur" style="padding:4px 14px">' + rest +
      '</div><div class="lockcover"><button class="lockbtn" data-unlock>留资解锁 · 完整高校排行</button></div></div>' : "")
    : '<div class="card empty-tip">该单位在当前口径下暂无录用记录</div>') +
  (locked ? unlockCardHTML("解锁「" + esc(pname) + "」完整排行") : formHTML(""));
}

/* ---------- 搜索联想 ---------- */
function sugBox(){ return document.getElementById("sug"); }
function doSuggest(q){
  var sugEl = sugBox();
  if(!sugEl) return;
  q = q.trim();
  if(!q){ sugEl.classList.remove("on"); sugEl.innerHTML = ""; return; }
  var ql = q.toLowerCase(), out = "", cnt = 0;
  /* 省份直达 */
  var pq = q.replace(/省|市$/g, "");
  for(var p = 0; p < NP; p++){
    if(PROVS[p] === pq || PROVS[p] === q){
      out += '<div class="sug-item pv" data-nav="#/p/' + uenc(PROVS[p]) + '"><span class="n">查看「' + esc(PROVS[p]) + '」全部高校排行 →</span><span class="v">省份</span></div>';
      break;
    }
  }
  var hits = [];
  SCHOOLS.forEach(function(s){
    var ks = searchKeys(s.name);
    for(var i = 0; i < ks.length; i++){
      if(ks[i].toLowerCase().indexOf(ql) >= 0){ hits.push(s); return; }
    }
  });
  hits.sort(function(a,b){ return b.total - a.total; });
  for(var i = 0; i < hits.length && cnt < 8; i++, cnt++){
    var nm = esc(hits[i].name).replace(new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "i"), "<em>$1</em>");
    out += '<div class="sug-item" data-nav="#/s/' + uenc(hits[i].name) + '"><span class="n">' + nm + '</span><span class="v">' + fmt(hits[i].total) + " 人</span></div>";
  }
  if(!out) out = '<div class="sug-empty">未找到相关学校（数据覆盖国网2026年公示的 ' + SCHOOLS.length + ' 所高校）</div>';
  sugEl.innerHTML = out;
  sugEl.classList.add("on");
}

/* ---------- 路由 ---------- */
function route(){
  var se = sugBox();
  if(se){ se.classList.remove("on"); se.innerHTML = ""; }
  var h = "";
  try{ h = decodeURIComponent(location.hash || ""); }catch(e){ h = location.hash || ""; }
  if(h.indexOf("#/s/") === 0){ renderSchool(BYNAME[h.slice(4)]); }
  else if(h.indexOf("#/p/") === 0){ renderProv(h.slice(4)); }
  else { renderHome(); }
  window.scrollTo(0, 0);
}

/* ---------- 事件 ---------- */
document.addEventListener("click", function(e){
  if(e.target.closest("[data-unlock]")){ openModal(curSchoolName()); return; }
  if(e.target.id === "mx" || e.target.id === "mask"){ closeModal(); return; }
  var nav = e.target.closest("[data-nav]");
  if(nav){ location.hash = nav.getAttribute("data-nav"); return; }
  var b = e.target.closest("#batchTabs button");
  if(b){ STATE.batch = +b.getAttribute("data-b"); rerender(); return; }
  var c = e.target.closest("#catChips .chip");
  if(c){
    var ci = +c.getAttribute("data-c"), on = 0, i;
    for(i = 0; i < 4; i++) if(STATE.cats[i]) on++;
    if(STATE.cats[ci] && on === 1) return;   /* 至少保留一类 */
    STATE.cats[ci] = !STATE.cats[ci];
    rerender(); return;
  }
  if(e.target.closest("#qGo")){
    var q = document.getElementById("q");
    if(q && q.value.trim()){
      var h = hitsFirst(q.value.trim());
      if(h) location.hash = h;
    }
    return;
  }
  if(e.target.closest("#exp100")){
    var box = document.getElementById("topBox");
    if(box){ box.innerHTML = topRows(100); e.target.style.display = "none"; }
    return;
  }
  if(!e.target.closest(".search")){ var se = sugBox(); if(se) se.classList.remove("on"); }
});
document.addEventListener("input", function(e){
  if(e.target.id === "q") doSuggest(e.target.value);
});
document.addEventListener("keydown", function(e){
  if(e.target.id === "q" && e.key === "Enter"){
    var q = e.target.value.trim();
    if(q){ var h = hitsFirst(q); if(h){ location.hash = h; var se = sugBox(); if(se) se.classList.remove("on"); } }
  }
});
document.getElementById("hdCta").addEventListener("click", function(){
  if(!isUnlocked()){ openModal(curSchoolName()); return; }
  var f = document.getElementById("ctaSec");
  if(!f){ location.hash = "#/"; setTimeout(function(){ var g = document.getElementById("ctaSec"); if(g) g.scrollIntoView({behavior:"smooth"}); }, 60); }
  else f.scrollIntoView({behavior:"smooth"});
});

function curSchoolName(){
  var h = "";
  try{ h = decodeURIComponent(location.hash || ""); }catch(e){ h = location.hash || ""; }
  return h.indexOf("#/s/") === 0 ? h.slice(4) : "";
}

function hitsFirst(q){
  var ql = q.toLowerCase();
  var pq = q.replace(/省|市$/g, "");
  for(var p = 0; p < NP; p++){ if(PROVS[p] === pq || PROVS[p] === q) return "#/p/" + uenc(PROVS[p]); }
  var best = null;
  SCHOOLS.forEach(function(s){
    var ks = searchKeys(s.name);
    for(var i = 0; i < ks.length; i++){
      if(ks[i].toLowerCase().indexOf(ql) === 0){ if(!best || s.total > best.total) best = s; return; }
    }
  });
  if(!best) SCHOOLS.forEach(function(s){
    if(s.name.toLowerCase().indexOf(ql) >= 0){ if(!best || s.total > best.total) best = s; }
  });
  return best ? "#/s/" + uenc(best.name) : "";
}

function rerender(){
  var h = location.hash || "";
  if(h.indexOf("#/s/") === 0){ try{ renderSchool(BYNAME[decodeURIComponent(h.slice(4))]); }catch(e){} }
  else if(h.indexOf("#/p/") === 0){ try{ renderProv(decodeURIComponent(h.slice(4))); }catch(e){} }
}

/* ---------- 表单提交 ---------- */
var API_BASE = /sigedianwang\.cn$/.test(location.hostname) ? "" : "https://sigedianwang.cn";
document.addEventListener("submit", function(e){
  var f = e.target.closest(".lead-form");
  if(!f) return;
  e.preventDefault();
  var fd = {};
  ["name","phone","school","major"].forEach(function(k){ fd[k] = (f.elements[k].value || "").trim(); });
  var msg = f.querySelector(".f-msg");
  if(!fd.name || !fd.phone || !fd.school || !fd.major){ msg.textContent = "请完整填写 姓名 / 手机号 / 学校 / 专业"; msg.className = "f-msg err"; return; }
  if(!/^1[3-9]\d{9}$/.test(fd.phone)){ msg.textContent = "手机号格式不正确"; msg.className = "f-msg err"; return; }
  var btn = f.querySelector("button");
  btn.disabled = true; btn.textContent = "提交中…";
  msg.textContent = ""; msg.className = "f-msg";
  fd.page = "school26";
  fetch(API_BASE + "/api/public/forms/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(fd)
  }).then(function(r){ return r.json(); }).then(function(res){
    if(res && res.ok){
      if(f.closest("#mask")){
        f.reset(); unlock(); closeModal(); toast("解锁成功，已可查看全部明细");
        var y = window.scrollY; route(); window.scrollTo(0, y);
      }else{
        f.innerHTML = '<div class="f-ok"><b>提交成功</b><span>咨询师将尽快与你联系，请保持手机畅通</span></div>';
      }
    }else{
      btn.disabled = false; btn.textContent = "立即免费领取";
      msg.textContent = (res && res.error) || "提交失败，请稍后重试";
      msg.className = "f-msg err";
    }
  }).catch(function(){
    btn.disabled = false; btn.textContent = "立即免费领取";
    msg.textContent = "网络异常，请稍后重试";
    msg.className = "f-msg err";
  });
});

/* ---------- 启动 ---------- */
window.addEventListener("hashchange", route);
route();
})();
</script>
