<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>国网2027届校招 · 宣讲行程与招聘条件查询</title>
<style>
:root{
  --blue:#0a69cd; --blue-dark:#085099; --blue-bg:#eef5fd; --blue-line:#d5e5f7;
  --red:#E63946; --orange:#F77F00; --gold:#FCBF49;
  --ink:#1a2433; --ink2:#5a6b80; --ink3:#93a3b8;
  --bg:#f4f7fb; --card:#ffffff; --line:#e6ecf3;
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:0 14px 60px}

/* header */
header{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);color:#fff;padding:26px 14px 58px;position:relative}
.hd-in{max-width:860px;margin:0 auto;padding:0 14px}
header h1{font-size:21px;font-weight:700;letter-spacing:.5px}
header .sub{font-size:13px;opacity:.85;margin-top:5px}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{flex:1;background:rgba(255,255,255,.14);border-radius:10px;padding:10px 6px;text-align:center;backdrop-filter:blur(2px)}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:11px;opacity:.85}

/* tabs floating */
.tabs{display:flex;max-width:860px;margin:-32px auto 0;padding:0 14px;position:relative;z-index:2}
.tab{flex:1;text-align:center;padding:12px 0;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none}
.tab:first-child{border-radius:12px 0 0 12px}
.tab:last-child{border-radius:0 12px 12px 0}
.tab+.tab{border-left:none}
.tab.on{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-line)}

/* toolbar */
.toolbar{margin-top:16px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.slabel{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:1px;padding:4px 2px 5px}
.slabel b{color:var(--blue)}
.search{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;height:42px;transition:border-color .2s}
.search:focus-within{border-color:var(--blue)}
.search svg{flex:none;width:17px;height:17px;stroke:var(--ink3)}
.search input{flex:1;border:none;outline:none;font-size:14.5px;padding:0 8px;background:transparent;color:var(--ink)}
.search .clr{flex:none;border:none;background:none;color:var(--ink3);font-size:16px;cursor:pointer;padding:4px 6px;display:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 2px 4px}
.chip{flex:none;padding:6px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.quick{display:flex;gap:7px;padding:2px 2px 0}
.quick .q{flex:none;padding:4px 11px;border-radius:8px;font-size:12px;color:var(--ink2);background:#fff;border:1px dashed var(--line);cursor:pointer}
.quick .q.on{background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue);font-weight:600}
.rescount{font-size:12px;color:var(--ink3);padding:8px 4px 0}

/* date group */
.dgroup{margin-top:14px}
.dhead{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
.dhead .db{font-weight:700;font-size:15px;color:var(--blue)}
.dhead .n{font-size:12px;color:var(--ink3)}
.dhead .bar{flex:1;height:1px;background:var(--line)}

/* stop card */
.stop{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:9px;transition:box-shadow .15s}
.stop:active{box-shadow:0 2px 10px rgba(10,105,205,.08)}
.stop .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stop .school{font-size:16px;font-weight:700;flex:1;min-width:0}
.stop .pv{flex:none;font-size:11.5px;font-weight:600;color:var(--blue);background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:6px;padding:2px 8px}
.stop .pv.hot{color:#fff;background:var(--red);border-color:var(--red)}
.stop .time{font-size:13px;color:var(--orange);font-weight:600;margin-top:6px}
.stop .place{font-size:13px;color:var(--ink2);margin-top:3px;word-break:break-all}
.stop .extra{font-size:12px;color:var(--ink3);margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.stop.past{opacity:.55}
.badge-today{font-size:10.5px;font-weight:700;color:#fff;background:var(--red);border-radius:5px;padding:1px 6px;vertical-align:2px;margin-left:6px}

/* note */
.note{background:#fff8ec;border:1px solid #f3e2bb;border-radius:10px;padding:10px 13px;font-size:12.5px;color:#8a6d2f;margin:12px 0}
.empty{text-align:center;color:var(--ink3);font-size:14px;padding:60px 0}
.empty .e{font-size:38px;display:block;margin-bottom:10px}

/* condition cards */
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:12px;overflow:hidden}
.ccard>summary{list-style:none;cursor:pointer;display:flex;align-items:center;padding:14px 15px;gap:8px}
.ccard>summary::-webkit-details-marker{display:none}
.ccard .nm{font-size:15.5px;font-weight:700;flex:1}
.ccard .sign{font-size:12px;color:var(--ink3)}
.ccard .arr{flex:none;width:16px;height:16px;stroke:var(--ink3);transition:transform .2s}
.ccard[open] .arr{transform:rotate(90deg)}
.cbody{padding:0 15px 14px;border-top:1px solid var(--line)}
.frow{padding:9px 0;border-bottom:1px dashed var(--line)}
.frow:last-child{border-bottom:none}
.frow .fk{font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:3px;letter-spacing:.5px}
.frow .fv{font-size:13px;color:var(--ink2);white-space:pre-wrap;word-break:break-all}
.frow .fv.dim{color:var(--ink3)}
.applytime{margin-top:10px;background:var(--blue-bg);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--blue);font-weight:600}

/* subunit */
.subcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-top:12px}
.subcard .nm{font-size:15.5px;font-weight:700;color:var(--blue)}
.tip{font-size:12px;color:var(--ink3);text-align:center;margin-top:26px;padding-bottom:20px}

/* lead form */
.fab{position:fixed;right:16px;bottom:22px;z-index:50;background:var(--red);color:#fff;border:none;border-radius:999px;padding:12px 18px;font-size:14.5px;font-weight:700;box-shadow:0 6px 18px rgba(230,57,70,.35);cursor:pointer}
.fab:active{transform:scale(.96)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(15,30,50,.45);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:22px 18px 30px;max-height:88vh;overflow-y:auto}
@media(min-width:600px){.modal{align-items:center;padding:20px}.sheet{border-radius:16px}}
.sheet h3{font-size:18px;font-weight:700}
.sheet .s{font-size:12.5px;color:var(--ink3);margin:4px 0 14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:14.5px;outline:none;background:#fff;color:var(--ink);-webkit-appearance:none}
.fld input:focus,.fld select:focus{border-color:var(--blue)}
.fld .err{font-size:11.5px;color:var(--red);margin-top:4px;display:none}
.submit{width:100%;height:46px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;margin-top:6px}
.submit:disabled{opacity:.6}
.okbox{text-align:center;padding:26px 0 10px;display:none}
.okbox .t{font-size:40px}
.okbox b{display:block;font-size:17px;margin:8px 0 4px}
.okbox p{font-size:13px;color:var(--ink2)}
.xrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x{background:none;border:none;font-size:24px;color:var(--ink3);cursor:pointer;line-height:1}
.fallback{margin-top:12px;text-align:center;font-size:12.5px;color:var(--ink3)}
.fallback a{color:var(--blue)}

/* 留资门控 */
.lockcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 20px 28px;text-align:center;margin-top:16px}
.lockcard .ic{font-size:42px}
.lockcard h2{font-size:18px;font-weight:700;margin:10px 0 6px}
.lockcard>p{font-size:13px;color:var(--ink2)}
.lockcard ul{list-style:none;margin:14px 0 4px;text-align:left;max-width:360px;margin-left:auto;margin-right:auto}
.lockcard li{font-size:13px;color:var(--ink2);padding:6px 0;border-bottom:1px dashed var(--line)}
.lockcard li:last-child{border-bottom:none}
.lockcard li b{color:var(--blue)}
.lockbtn{display:inline-block;margin-top:12px;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px 36px;font-size:15.5px;font-weight:700;cursor:pointer}
.lockbtn:active{transform:scale(.97)}
.locknote{font-size:11.5px;color:var(--ink3);margin-top:12px;line-height:1.6}
</style>
</head>
<body>
<header>

<div class="wrap">

  <!-- 条件 -->

  </section>

  <!-- 直属 -->
  <section id="tab-sub" style="display:none">
    <div id="sublist"></div>
  </section>
</div>

<!-- 留资 -->
<button class="fab" id="fab">💬 咨询 / 领资料</button>
<div class="modal" id="leadModal">

    <div class="okbox" id="okbox"><div class="t">✅</div><b>提交成功！</b><p>思格老师会尽快联系你，请保持手机畅通</p></div>
    <div class="fallback">提交遇到问题？<a href="https://sjszgjy1.mikecrm.com/hs2Fito" target="_blank" rel="noopener">点这里填写表单</a></div>
  </div>
</div>

/* ---------- 渲染行程 ---------- */
function matchQuick(s){
  const n = daysFromToday(s);
  if(quick==='up7')  return n!==null && n>=0 && n<=7;
  if(quick==='up14') return n!==null && n>=0 && n<=14;
  if(quick==='und')  return n===null;
  return true;
}
function matchKw(s, k){
  if(!k) return true;
  const n = norm(k);
  return norm(s.s).includes(n) || norm(s.p).includes(n) || norm(s.x).includes(n) || norm(s.dr).includes(n) || norm(s.pv).includes(n);
}
function fmtDateCN(isoS){
  const t = iso(isoS);
  return (t.getMonth()+1)+'月'+t.getDate()+'日 周'+'日一二三四五六'[t.getDay()];
}
function renderRoute(){
  const list = stops.filter(s =>
    (selPv.size===0 || selPv.has(s.pv)) && matchQuick(s) && matchKw(s, kwRoute));
  list.sort((a,b) => (a.d||'9999') < (b.d||'9999') ? -1 : (a.d||'9999') > (b.d||'9999') ? 1 : a.pv.localeCompare(b.pv,'zh'));
  const pvHit = new Set(list.map(x=>x.pv));
  $('#rescount').textContent = `共 ${list.length} 场 · 涉及 ${pvHit.size} 个省市单位 · 按日期从近到远`;
  if(!list.length){
    $('#list').innerHTML = `<div class="empty"><span class="e">🔍</span>没有符合条件的行程<br><small>试试放宽筛选条件</small></div>`;
    return;
  }
  let html = '', lastDate = '';
  list.forEach(s => {
    const key = s.d || 'und';
    if(key !== lastDate){
      lastDate = key;
      const head = s.d
        ? fmtDateCN(s.d) + (daysFromToday(s)===0 ? '<span class="badge-today">今天</span>' : (daysFromToday(s)===1 ? '<span class="badge-today" style="background:var(--orange)">明天</span>' : ''))
        : '时间待定 / 见院校官网';
      html += `<div class="dgroup"><div class="dhead"><span class="db">${head}</span><span class="bar"></span></div></div>`;
    }
    const past = daysFromToday(s)!==null && daysFromToday(s)<0;
    html += `<div class="stop${past?' past':''}">
      <div class="r1"><span class="school">${esc(s.s)||'待更新'}</span><span class="pv">${esc(s.pv)}</span></div>
      ${s.t?`<div class="time">🕘 ${esc(s.t)}</div>`:''}
      ${s.p?`<div class="place">📍 ${esc(s.p)}</div>`:''}
      ${s.x?`<div class="extra">面向院校：${esc(s.x)}</div>`:''}
    </div>`;
  });
  $('#list').innerHTML = html;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      <li><b>${schools.size} 所</b>院校站点时间与地点，支持按学校/省份/时间筛选</li>
      <li>各单位<b>招聘条件</b>与报名时间（专业/学历/四六级/年龄）</li>
      <li>附赠 2027 届备考资料包，思格老师 1v1 咨询</li>
    </ul>
    <button class="lockbtn">🔓 立即免费解锁</button>
    <div class="locknote">信息仅用于备考服务与联系，不会外泄</div>
  </div>`;
}
function applyGate(){
  document.querySelectorAll('.toolbar').forEach(t => t.style.display = unlocked ? '' : 'none');
  $('#fab').textContent = unlocked ? '💬 咨询 / 领资料' : '🔓 留资免费解锁';
  if(unlocked){
    $('#sublist').innerHTML = SUB_HTML;
    renderRoute(); renderCond();
  }else{
    $('#list').innerHTML = lockCardHTML();
    $('#condlist').innerHTML = lockCardHTML();
    $('#sublist').innerHTML = lockCardHTML();
  }
}
function doUnlock(){
  if(unlocked) return;
  unlocked = true;
  try{ localStorage.setItem(LOCK_KEY, '1'); }catch(e){}
  applyGate();
}
document.addEventListener('click', e => {
  if(e.target.classList && e.target.classList.contains('lockbtn')) modal.classList.add('on');
});

renderRoute();
renderCond();
applyGate();

/* ---------- 留资 ---------- */
const API_BASE = (location.protocol === 'http:' || location.protocol === 'https:')
  ? 'api/' : 'https://sigedianwang.cn/campus26/api/';
const modal = $('#leadModal');
$('#fab').addEventListener('click', () => modal.classList.add('on'));
$('#xbtn').addEventListener('click', () => modal.classList.remove('on'));
modal.addEventListener('click', e => { if(e.target === modal) modal.classList.remove('on'); });

/* 意向省份下拉：取行程表里的省份 */
(function(){
  const sel = $('#f-target');
  DATA.provinces.forEach(p => {
    const o = document.createElement('option');
    o.value = p.name; o.textContent = p.name;
    sel.appendChild(o);
  });
})();

$('#leadForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#f-name').value.trim();
  const phone = $('#f-phone').value.trim();
  const okName = !!name, okPhone = /^1\d{10}$/.test(phone);
  $('#e-name').style.display = okName ? 'none' : 'block';
  $('#e-phone').style.display = okPhone ? 'none' : 'block';
  if(!okName || !okPhone) return;
  const btn = $('#fsub');
  btn.disabled = true; btn.textContent = '提交中…';
  try{
    const r = await fetch(API_BASE + 'submit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        name, phone,
        school: $('#f-school').value.trim(),
        grade: $('#f-grade').value,
        target: $('#f-target').value,
        page: 'campus26'
      })
    });
    if(!r.ok) throw new Error('http '+r.status);
    $('#leadForm').style.display = 'none';
    $('#okbox').style.display = 'block';
    document.querySelector('.fallback').style.display = 'none';
    doUnlock();
  }catch(err){
    if(location.protocol === 'file:'){
      $('#leadForm').style.display = 'none';
      $('#okbox').style.display = 'block';
      document.querySelector('.fallback').style.display = 'none';
      doUnlock();
    }else{
      alert('网络异常，提交失败。请点击下方链接填写表单，或稍后重试。');
    }
  }finally{
    btn.disabled = false; btn.textContent = '立即提交';
  }
});
</script>
</body>
</html>
